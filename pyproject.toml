[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-to-change"
version = "0.1.0"
description = "Self-hosted Telegram market-timing assistant for FX, stocks, crypto, and metals"
readme = "README.en.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-mock>=3.12",
  "ruff>=0.5",
  "mypy>=1.10",
  "freezegun>=1.5",
]
backtest = [
  "pyarrow>=16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# RUF001-003: мы пишем русские комментарии и строки, кириллица не баг.
# UP017: datetime.UTC доступен с 3.11, но timezone.utc одинаково корректен.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
