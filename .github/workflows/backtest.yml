name: backtest

# Ручной бэктест на исторических данных Twelve Data.
# Не трогает state.json, выкладывает отчёт как artifact.
on:
  workflow_dispatch:
    inputs:
      months:
        description: 'месяцев часовой истории (1-12)'
        required: false
        default: '12'
      starting_eur:
        description: 'стартовая сумма EUR'
        required: false
        default: '1000'
      min_edge_pct:
        description: 'override MIN_EDGE_PCT'
        required: false
        default: '2.5'

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .[backtest]

      - name: Run backtest
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          BACKTEST_MONTHS: ${{ github.event.inputs.months }}
          BACKTEST_STARTING_EUR: ${{ github.event.inputs.starting_eur }}
          BACKTEST_MIN_EDGE_PCT: ${{ github.event.inputs.min_edge_pct }}
        run: |
          python -m src.cli.backtest \
            --months "$BACKTEST_MONTHS" \
            --starting-eur "$BACKTEST_STARTING_EUR" \
            --min-edge-pct "$BACKTEST_MIN_EDGE_PCT"

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backtest-report
          path: data/backtest/
          retention-days: 30
